name: Release

# Push a tag like v0.2.0 and this builds a Windows .exe, a macOS .dmg and a
# Linux package and attaches them to a GitHub Release. The apps start already
# connected to the team server (repository variable GOTHERMO_SERVER).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            platform: windows/amd64
          - name: macos
            os: macos-latest
            platform: darwin/universal
          - name: linux
            os: ubuntu-22.04
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Linux system libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails (same version as go.mod)
        shell: bash
        run: |
          V=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)
          echo "Wails $V"
          go install github.com/wailsapp/wails/v2/cmd/wails@$V

      - name: Build
        shell: bash
        env:
          # The desktop app opens already connected to this server.
          VITE_DEFAULT_SERVER: ${{ vars.GOTHERMO_SERVER || 'https://gothermo-team.duckdns.org' }}
        run: wails build -clean -platform ${{ matrix.platform }}

      - name: Package (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item build/bin/GoThermo.exe out/GoThermo-windows-amd64.exe
          Compress-Archive -Path build/bin/* -DestinationPath out/GoThermo-windows-amd64.zip

      - name: Package (macOS)
        if: matrix.name == 'macos'
        run: |
          mkdir out dmg
          APP=$(ls -d build/bin/*.app | head -1)
          # Without any signature macOS on Apple Silicon says the app is "damaged".
          # An ad-hoc signature (free, no Apple account) fixes that; the first
          # launch still needs "Open Anyway" in System Settings.
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" out/GoThermo-macos.zip
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname GoThermo -srcfolder dmg -ov -format UDZO out/GoThermo-macos.dmg

      - name: Package (Linux)
        if: matrix.name == 'linux'
        run: |
          mkdir out
          tar -czf out/GoThermo-linux-amd64.tar.gz -C build/bin .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Download for your system: **Windows** `GoThermo-windows-amd64.exe`, **macOS** `GoThermo-macos.dmg`, **Linux** `GoThermo-linux-amd64.tar.gz`.
            The app opens already connected to the team server: register with the invite code you were given. You can also use GoThermo in a browser, with nothing to install.
            The builds are not code-signed. Windows: "More info", then "Run anyway". macOS: open the .dmg, drag GoThermo to Applications, try to open it, then System Settings, Privacy & Security, "Open Anyway". If macOS says the app is damaged or will not open, run once in Terminal: `xattr -cr /Applications/GoThermo.app && codesign --force --deep --sign - /Applications/GoThermo.app`
