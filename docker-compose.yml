# One command starts the whole team server:
#   DOMAIN=chat.example.com INVITE_CODE=$(openssl rand -hex 12) docker compose up -d --build
# Keep INVITE_CODE in a .env file next to this one so it survives restarts.
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  gothermo:
    build: .
    environment:
      REDIS_ADDR: redis:6379
      GOTHERMO_INVITE_CODE: ${INVITE_CODE:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTHERMO_TRUST_PROXY: "1"
    volumes:
      - uploads:/data
    depends_on:
      - redis
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN, for example chat.example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - gothermo
    restart: unless-stopped

volumes:
  redis-data:
  uploads:
  caddy-data:
