# One command starts the whole team server:
#   DOMAIN=chat.example.com INVITE_CODE=$(openssl rand -hex 12) docker compose up -d --build
# Keep INVITE_CODE in a .env file next to this one so it survives restarts.
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gothermo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (letters and digits only)}
      POSTGRES_DB: gothermo
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gothermo -d gothermo"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  gothermo:
    build: .
    environment:
      REDIS_ADDR: redis:6379
      DATABASE_URL: postgres://gothermo:${POSTGRES_PASSWORD}@postgres:5432/gothermo
      # empty = Postgres; set redis to stay on Redis on purpose (see SERVER.md "Moving to Postgres")
      GOTHERMO_STORE: ${GOTHERMO_STORE:-}
      GOTHERMO_INVITE_CODE: ${INVITE_CODE:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
      GOOGLE_WEB_CLIENT_SECRET: ${GOOGLE_WEB_CLIENT_SECRET:-}
      GOTHERMO_PUBLIC_URL: https://${DOMAIN}
      GOTHERMO_TRUST_PROXY: "1"
    volumes:
      - uploads:/data
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN, for example chat.example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - gothermo
    restart: unless-stopped

volumes:
  redis-data:
  pg-data:
  uploads:
  caddy-data:
