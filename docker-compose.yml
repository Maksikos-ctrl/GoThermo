# One command starts the whole team server:
#   DOMAIN=chat.example.com INVITE_CODE=$(openssl rand -hex 12) docker compose up -d --build
# Keep INVITE_CODE in a .env file next to this one so it survives restarts.
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gothermo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (letters and digits only)}
      POSTGRES_DB: gothermo
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gothermo -d gothermo"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  gothermo:
    build: .
    environment:
      REDIS_ADDR: redis:6379
      DATABASE_URL: postgres://gothermo:${POSTGRES_PASSWORD}@postgres:5432/gothermo
      # empty = Postgres; set redis to stay on Redis on purpose (see SERVER.md "Moving to Postgres")
      GOTHERMO_STORE: ${GOTHERMO_STORE:-}
      GOTHERMO_INVITE_CODE: ${INVITE_CODE:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
      GOOGLE_WEB_CLIENT_SECRET: ${GOOGLE_WEB_CLIENT_SECRET:-}
      GOTHERMO_PUBLIC_URL: https://${DOMAIN}
      # Relay for calls on mobile networks. Empty unless TURN_SECRET is set in .env.
      # Admin sign-in (login: admin). Empty password = no admin account.
      GOTHERMO_ADMIN_USER: ${ADMIN_USER:-admin}
      GOTHERMO_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # GIF search (Giphy). Empty = no GIF button.
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
      GOTHERMO_TURN_SECRET: ${TURN_SECRET:-}
      GOTHERMO_TURN_URLS: ${TURN_SECRET:+turn:${DOMAIN}:3478?transport=udp,turn:${DOMAIN}:3478?transport=tcp}
      GOTHERMO_TRUST_PROXY: "1"
    volumes:
      - uploads:/data
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN, for example chat.example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - gothermo
    restart: unless-stopped

  # Optional call relay. Turn it on with TURN_SECRET and COMPOSE_PROFILES=turn
  # in .env (see SERVER.md, "Calls on mobile networks").
  coturn:
    image: coturn/coturn:4.6.2
    profiles: ["turn"]
    network_mode: host
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        exec turnserver --no-cli --fingerprint --lt-cred-mech --use-auth-secret
        --static-auth-secret="$$TURN_SECRET" --realm="$$DOMAIN"
        --listening-port=3478 --min-port=49152 --max-port=49252
        --no-multicast-peers --no-tls --no-dtls
        --denied-peer-ip=10.0.0.0-10.255.255.255
        --denied-peer-ip=172.16.0.0-172.31.255.255
        --denied-peer-ip=192.168.0.0-192.168.255.255
        --denied-peer-ip=169.254.0.0-169.254.255.255
        --denied-peer-ip=127.0.0.0-127.255.255.255
        $${TURN_EXTERNAL_IP:+--external-ip=$$TURN_EXTERNAL_IP}
    environment:
      TURN_SECRET: ${TURN_SECRET:-}
      DOMAIN: ${DOMAIN}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-}
    restart: unless-stopped

volumes:
  redis-data:
  pg-data:
  uploads:
  caddy-data:
